# ==============================================================
# NBINet MARC → CSV 欄位映射定義檔
# ==============================================================
#
# ── 基本格式 ──────────────────────────────────────────────────
#
#   欄位名稱: 來源1 來源2 ...
#       OPTION1=...
#       OPTION2=...
#
#   • 欄位名稱行：緊靠左邊界，冒號後接一或多個「來源」
#   • 選項行：**恰好 4 個空格**縮排，後接 KEY=VALUE
#   • 空白行與 # 開頭的注釋行會被忽略
#
# ── 來源格式 ──────────────────────────────────────────────────
#
#   TAGsf      MARC tag（三位數）+ 一或多個子欄碼，例如：
#                  245a        取 245$a
#                  200ahe      取 200$a、$h、$e（以 SUBFIELD_JOIN 串接）
#                  490av       取 490$a、$v
#
#   008[N:L]   008 控制欄位段落，偏移量 N、長度 L，例如：
#                  008[07:4]   取西元年（位置 07 起共 4 碼）
#                  008[35:3]   取語言代碼（位置 35 起共 3 碼）
#
#   同一欄位可列多個來源（空格分隔），依優先序由左至右，
#   取到第一個非空結果即停止（見 TAKE 與 SOURCES_JOIN）。
#
# ── 選項說明 ──────────────────────────────────────────────────
#
#   TAKE=first  （預設）同一 TAG 有多筆時，只取第一筆
#   TAKE=all    同一 TAG 有多筆時，全部收集並以 JOIN 串接
#
#   JOIN=<分隔符>
#               TAKE=all 時，多筆之間的分隔符（預設 ；全形分號）
#               例：JOIN=;  或  JOIN=  （等號後空一格）
#
#   SUBFIELD_JOIN=<分隔符>
#               同一筆記錄中，多個子欄值之間的分隔符
#               SUBFIELD_JOIN= （等號後恰好 1 個空格，行尾）→ 以空格分隔
#               SUBFIELD_JOIN=（等號後無字元，行尾）         → 直接串接（無分隔）
#
#   SOURCES_JOIN=<分隔符>
#               啟用「跨來源合併」模式：對每個來源各取第一個非空值，
#               再將各結果以此分隔符串接。適用於需要同時顯示主書名
#               與並列題名的「全書名」欄位。
#               SOURCES_JOIN= （等號後恰好 1 個空格，行尾）→ 以空格分隔
#               ※ 設定 SOURCES_JOIN 後，TAKE 與 JOIN 選項會被忽略。
#
#   TRANSFORM=T1,T2,...
#               資料轉換管線（依序套用）
#               HTML_DECODE    解碼 HTML 實體（&amp; 等）
#               STRIP_PUNCT    去除首尾的 / : , ; 。，、 等常見標點
#               ISBN_CLEAN     去除 ISBN 中的連字號與空格，
#                              並驗證長度（10 或 13 碼）
#               YEAR_CE        從字串中提取四位數西元年
#               YEAR_ROC       從字串中提取四位數西元年並換算為民國年
#               BINDING        將裝訂描述正規化為「平裝」/「精裝」/「套裝」/「其他」
#               FOUR_CORNER    查 Unicode Unihan 四角號碼（含小數部分）
#               FOUR_CORNER_INT 查 Unicode Unihan 四角號碼（只取整數部分）
#
# ── MARC21 / UNIMARC 對應說明 ─────────────────────────────────
#
#   NBINet 館藏同時含有 MARC21 與 UNIMARC 格式紀錄，
#   因此每個欄位通常同時列出兩種格式的來源，
#   系統依優先序取第一個非空結果：
#
#     書名:     245a（MARC21）優先；200ahe（UNIMARC）次之
#     並列題名: 246a（MARC21）優先；200d（UNIMARC）次之
#     …
#
# ==============================================================

登錄號:
